# teacherin-test-suite CI：运行接口自动化与 E2E，产出统一报告。
# 仅定时（schedule）夜间回归和手动 Run pipeline 触发；推送 / 合并不创建流水线。
#
# 需要在 GitLab CI/CD Variables 中配置的被测环境凭据（Token、域名等），见 docs/run-guide.md。
# Schedule 执行配置（跑哪些项目、发布报告、企微）见 docs/pipeline-schedule-variables.md。
#
# 常用凭据示例（建议 Masked）：
#   API_TOKEN / TEST_TOKEN     主站 accessToken
#   ADMIN_API_TOKEN            管理后台 accessToken（可选，缺省回落主站 token）
#   E2E_USERNAME / E2E_PASSWORD （可选）E2E 登录账号
# 企微通知 Webhook 用 WECOM_WEBHOOK_URL 注入。
# 静态报告发布成功后，企微通知默认最多等待 30s（WECOM_PUBLISH_WAIT_SECONDS）再发送。
#
# test-suite 执行策略：
#   不在推送 / 合并时跑流水线
#   定时任务 schedule：通过 TEST_SUITE_PROJECTS 选择 api | e2e-web | e2e-mobile
#                       未配置时默认 api（全量 tests/api，非 demo）
#   手动 Run pipeline（web）：与 schedule 相同，可用变量覆盖环境和项目
# Schedule 变量完整说明见 docs/pipeline-schedule-variables.md
#
# 报告发布到同一套 Coolify 静态站（与 classinshop 共用仓，目录分开）：
#   REPORT_PUBLISH_BASE_URL=https://classinshop-test-reports.coolify.eeo-inc.com
#   REPORT_PUBLISH_GIT_REPO=https://skills.eeo-inc.com/kailiang.qiu/classinshop-test-reports.git
#   REPORT_PUBLISH_GIT_TOKEN=<GitLab PAT，write_repository，Masked>
# 发布路径：teacherin/{env}/all/latest/enhanced/（每环境只留最新）
# 或 rsync/local 备选：
#   REPORT_PUBLISH_RSYNC_TARGET / REPORT_PUBLISH_LOCAL_DIR
#
# 报告清理：在 test-suite 建独立 Schedule
#   SCHEDULE_TASK=cleanup-reports
#
# 设计：一个 test-suite Job 内一次 playwright test，api + e2e 汇总到同一份 Enhanced 报告。

variables:
  PLAYWRIGHT_IMAGE: 'mcr.microsoft.com/playwright:v1.61.0-jammy'
  PNPM_VERSION: '10'
  REPORT_PUBLISH_SERIES: teacherin

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - prepare
  - test
  - maintain

.skip_on_cleanup_schedule:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "cleanup-reports"
      when: never
    - when: on_success

prepare:
  extends: .skip_on_cleanup_schedule
  stage: prepare
  image: ${PLAYWRIGHT_IMAGE}
  script:
    - |
      test_env="${SCHEDULE_TEST_ENV:-14}"
      echo "TEST_ENV=$test_env" > deploy.env
      cat deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

.install: &install
  - corepack enable
  - corepack prepare pnpm@${PNPM_VERSION} --activate
  - pnpm install --frozen-lockfile

.prepare_report_dirs: &prepare_report_dirs
  - mkdir -p reports/latest/enhanced reports/latest/html reports/latest/artifacts reports/latest/allure-results

.post_test_finalize: &post_test_finalize
  - |
    set +e
    if [ -f notify.env ]; then
      set -a
      . ./notify.env
      set +a
    fi
    NOTIFY_TARGET="${NOTIFY_TARGET:-all}"
    NOTIFY_SCOPE="${NOTIFY_SCOPE:-}"
    mkdir -p reports/latest
    if [ ! -f reports/latest/junit.xml ]; then
      printf '%s\n' \
        '<?xml version="1.0" encoding="UTF-8"?>' \
        '<testsuites name="teacherin-test-suite" tests="0" failures="0" errors="0" skipped="0"></testsuites>' \
        > reports/latest/junit.xml
      echo "WARN: junit.xml missing after tests; wrote empty placeholder."
    fi
    if [ -f reports/latest/enhanced/enhanced-report.html ]; then
      echo "Enhanced report ready: reports/latest/enhanced/enhanced-report.html"
    else
      echo "WARN: enhanced-report.html missing under reports/latest/enhanced/"
    fi

    if [ -n "${REPORT_PUBLISH_BASE_URL:-}" ] && { [ -n "${REPORT_PUBLISH_GIT_REPO:-}" ] || [ -n "${REPORT_PUBLISH_RSYNC_TARGET:-}" ] || [ -n "${REPORT_PUBLISH_LOCAL_DIR:-}" ]; }; then
      corepack enable
      corepack prepare pnpm@${PNPM_VERSION} --activate
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update -qq && apt-get install -y -qq git rsync openssh-client >/dev/null 2>&1 || true
      fi
      eval "$(pnpm exec tsx scripts/publish-report.ts \
        --env "${TEST_ENV}" \
        --target all \
        --source reports/latest/enhanced \
        --pipeline-id "${CI_PIPELINE_ID}" \
        --ref "${CI_COMMIT_REF_NAME}")" \
        || echo "WARN: publish-report failed; WeCom will fallback to GitLab Artifacts link."
    else
      echo "INFO: REPORT_PUBLISH_* not configured; skip static report publish."
    fi

    corepack enable
    corepack prepare pnpm@${PNPM_VERSION} --activate
    pnpm exec tsx scripts/wecom-notify.ts \
      --env "${TEST_ENV}" \
      --target all \
      --scope "${NOTIFY_SCOPE}" \
      --exit-code "${CI_JOB_STATUS:-failed}" \
      --junit reports/latest/junit.xml \
      --job-name "${CI_JOB_NAME}" \
      --project-name "${CI_PROJECT_NAME}" \
      --ref-name "${CI_COMMIT_REF_NAME}" \
      --pipeline-url "${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID}" \
      --job-url "${CI_JOB_URL}" \
      || echo "WARN: WeCom notification failed"

test-suite:
  extends: .skip_on_cleanup_schedule
  stage: test
  image: ${PLAYWRIGHT_IMAGE}
  needs:
    - job: prepare
      artifacts: true
  script:
    - *install
    - *prepare_report_dirs
    - bash scripts/ci-test-suite.sh
  after_script:
    - *post_test_finalize
  artifacts:
    when: always
    expose_as: 'Enhanced Report'
    paths:
      - reports/latest/junit.xml
      - reports/latest/publish.env
      - reports/latest/enhanced/enhanced-report.html
    reports:
      junit: reports/latest/junit.xml
    expire_in: 3 days

cleanup-published-reports:
  stage: maintain
  image: node:20-bookworm-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "cleanup-reports"
    - if: $CI_PIPELINE_SOURCE == "web" && $SCHEDULE_CLEANUP_REPORTS == "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm exec tsx scripts/cleanup-published-reports.ts
