<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{PORTAL_TITLE}}</title>
    <link rel="icon" href="{{PORTAL_ASSET_PREFIX}}favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="{{PORTAL_ASSET_PREFIX}}favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef2f7;
        --bg-accent: radial-gradient(1200px 480px at 10% -10%, #dbeafe 0%, transparent 55%),
          radial-gradient(900px 400px at 90% 0%, #e0e7ff 0%, transparent 50%), #eef2f7;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --surface-blue: linear-gradient(180deg, #f0f7ff 0%, #ffffff 100%);
        --surface-filter: linear-gradient(135deg, #eff6ff 0%, #f5f3ff 100%);
        --surface-panel-head: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 55%, #ede9fe 100%);
        --surface-list-head: #eef2ff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --primary-soft: #eff6ff;
        --pass: #059669;
        --pass-bg: #ecfdf5;
        --fail: #dc2626;
        --fail-bg: #fef2f2;
        --skip: #d97706;
        --skip-bg: #fffbeb;
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
        --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg-accent);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
      }

      .topbar {
        background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
        color: #fff;
        padding: 28px 20px 56px;
      }

      .topbar-inner {
        max-width: 1160px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(8px);
        display: grid;
        place-items: center;
        font-size: 1.4rem;
      }

      .brand h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .brand p {
        margin: 4px 0 0;
        color: rgba(255, 255, 255, 0.82);
        font-size: 0.92rem;
      }

      .topbar-badge {
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.22);
        font-size: 0.82rem;
        font-weight: 500;
      }

      .series-nav {
        display: flex;
        gap: 8px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .series-nav-link {
        padding: 8px 14px;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.86);
        text-decoration: none;
        font-size: 0.84rem;
        font-weight: 600;
      }

      .series-nav-link.is-active {
        background: #fff;
        color: #1e3a8a;
      }

      body.series-teacherin .topbar {
        background: linear-gradient(135deg, #115e59 0%, #0f766e 55%, #14b8a6 100%);
      }

      body.series-teacherin .series-nav-link.is-active {
        color: #115e59;
      }

      .page {
        max-width: 1160px;
        margin: -36px auto 0;
        padding: 0 20px 48px;
      }

      .latest-panel {
        margin-bottom: 18px;
        display: grid;
        gap: 12px;
      }

      .latest-card {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border-radius: var(--radius);
        border: 1px solid #93c5fd;
        background: linear-gradient(135deg, #eff6ff 0%, #ffffff 70%);
        box-shadow: var(--shadow-md);
        text-decoration: none;
        color: inherit;
      }

      .latest-card:hover {
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.12);
      }

      .latest-card h3 {
        margin: 0 0 6px;
        font-size: 1rem;
        color: #1e3a8a;
      }

      .latest-card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .latest-cta {
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        font-size: 0.88rem;
      }

      .action-links {
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: stretch;
        gap: 6px;
        justify-content: flex-end;
      }

      .link-btn {
        display: inline-flex;
        justify-content: center;
        white-space: nowrap;
        padding: 7px 11px;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        background: #fff;
        color: #334155;
        font-size: 0.78rem;
        font-weight: 600;
        text-decoration: none;
      }

      .link-btn:hover {
        border-color: #93c5fd;
        background: #eff6ff;
        color: var(--primary-dark);
      }

      .link-btn.primary {
        background: var(--primary-soft);
        border-color: #93c5fd;
        color: var(--primary-dark);
      }

      .report-row.is-history {
        cursor: default;
      }

      .badge-latest {
        flex-shrink: 0;
        margin-left: 0;
        padding: 2px 8px;
        border-radius: 999px;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 18px;
      }

      .stat-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px 18px 16px;
        box-shadow: var(--shadow-sm);
        position: relative;
        overflow: hidden;
        background: var(--card-bg, var(--surface));
      }

      .stat-card::after {
        content: '';
        position: absolute;
        right: -18px;
        top: -18px;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--accent, var(--primary));
        opacity: 0.08;
      }

      .stat-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--accent, var(--primary));
      }

      .stat-label {
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .stat-value {
        margin-top: 8px;
        font-size: 1.65rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--accent, var(--primary-dark));
      }

      .stat-hint {
        margin-top: 4px;
        font-size: 0.78rem;
        color: var(--muted);
      }

      .toolbar-card {
        background: var(--surface-filter);
        border: 1px solid #c7d2fe;
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 16px;
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .toolbar-title {
        font-size: 0.85rem;
        font-weight: 700;
        color: #4338ca;
        margin-right: 4px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.65);
      }

      .field {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .field label {
        font-size: 0.82rem;
        color: var(--muted);
        font-weight: 500;
      }

      select,
      .search-input {
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 9px 12px;
        font: inherit;
        font-size: 0.9rem;
        background: rgba(255, 255, 255, 0.92);
        color: var(--text);
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      select:focus,
      .search-input:focus {
        outline: none;
        border-color: #93c5fd;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .search-wrap {
        flex: 1;
        min-width: 220px;
        position: relative;
      }

      .search-wrap::before {
        content: '⌕';
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-52%);
        color: var(--muted);
        font-size: 0.95rem;
        pointer-events: none;
      }

      .search-input {
        width: 100%;
        padding-left: 34px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid #bfdbfe;
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow-md);
      }

      .panel-header {
        padding: 16px 20px;
        border-bottom: 1px solid #c7d2fe;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: var(--surface-panel-head);
      }

      .panel-header h2 {
        margin: 0;
        font-size: 1.02rem;
        font-weight: 700;
        color: #1e3a8a;
      }

      .panel-meta {
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 500;
      }

      .list-head,
      .report-row {
        display: grid;
        grid-template-columns: 236px 72px 88px minmax(140px, 1fr) 168px 110px;
        gap: 14px;
        align-items: center;
        padding: 0 20px;
      }

      .list-head {
        padding-top: 12px;
        padding-bottom: 10px;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #4338ca;
        border-bottom: 1px solid #dbeafe;
        background: var(--surface-list-head);
      }

      .report-list {
        max-height: 68vh;
        overflow-y: auto;
      }

      .report-row {
        min-height: 88px;
        padding-top: 10px;
        padding-bottom: 10px;
        overflow: hidden;
        border-bottom: 1px solid #e2e8f0;
        text-decoration: none;
        color: inherit;
        transition: background 0.15s ease, transform 0.15s ease;
        border-left: 4px solid transparent;
        background: #fcfdff;
      }

      .report-row:nth-child(even) {
        background: #f5f8ff;
      }

      .report-row:last-child {
        border-bottom: none;
      }

      .report-row:hover {
        background: #eef4ff;
      }

      .report-row.status-pass {
        border-left-color: var(--pass);
        background: linear-gradient(90deg, rgba(236, 253, 245, 0.65) 0%, #fcfdff 28%);
      }

      .report-row.status-pass:nth-child(even) {
        background: linear-gradient(90deg, rgba(236, 253, 245, 0.65) 0%, #f5f8ff 28%);
      }

      .report-row.status-fail {
        border-left-color: var(--fail);
        background: linear-gradient(90deg, rgba(254, 242, 242, 0.75) 0%, #fcfdff 28%);
      }

      .report-row.status-fail:nth-child(even) {
        background: linear-gradient(90deg, rgba(254, 242, 242, 0.75) 0%, #f5f8ff 28%);
      }

      .report-row.status-warn {
        border-left-color: var(--skip);
        background: linear-gradient(90deg, rgba(255, 251, 235, 0.85) 0%, #fcfdff 28%);
      }

      .report-row.status-warn:nth-child(even) {
        background: linear-gradient(90deg, rgba(255, 251, 235, 0.85) 0%, #f5f8ff 28%);
      }

      .time-main {
        display: inline-flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: 8px;
        white-space: nowrap;
        font-size: 0.88rem;
        font-weight: 600;
      }

      .time-sub {
        display: block;
        color: var(--muted);
        font-size: 0.76rem;
        margin-top: 3px;
        font-weight: 500;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 42px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        background: var(--primary-soft);
        color: var(--primary-dark);
        border: 1px solid #bfdbfe;
      }

      .target-chip {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--surface-soft);
        border: 1px solid var(--border);
        font-size: 0.8rem;
        font-weight: 600;
        word-break: break-word;
        line-height: 1.35;
      }

      .meta-title {
        font-weight: 600;
        font-size: 0.9rem;
        word-break: break-word;
      }

      .meta-sub {
        color: var(--muted);
        font-size: 0.78rem;
        margin-top: 4px;
        word-break: break-all;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .result-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 8px;
        font-size: 0.76rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .chip.pass {
        background: var(--pass-bg);
        color: var(--pass);
      }

      .chip.fail {
        background: var(--fail-bg);
        color: var(--fail);
      }

      .chip.skip {
        background: var(--skip-bg);
        color: var(--skip);
      }

      .chip.rate {
        background: #f1f5f9;
        color: #334155;
      }

      .action {
        text-align: right;
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font-size: 0.82rem;
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.28);
        transition: background 0.15s, transform 0.15s;
      }

      .report-row:hover .action-btn {
        background: var(--primary-dark);
      }

      .empty,
      .error,
      .loading {
        padding: 56px 20px;
        text-align: center;
        color: var(--muted);
      }

      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #dbeafe;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error {
        color: var(--fail);
      }

      .footer {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
      }

      @media (max-width: 1024px) {
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }

        .list-head {
          display: none;
        }

        .report-row {
          grid-template-columns: 1fr;
          gap: 10px;
          padding: 16px 18px;
        }

        .action {
          text-align: left;
        }
      }

      @media (max-width: 560px) {
        .stats {
          grid-template-columns: 1fr;
        }

        .topbar {
          padding-bottom: 48px;
        }
      }
    </style>
  </head>
  <body class="{{PORTAL_BODY_CLASS}}">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-icon">{{PORTAL_EMOJI}}</div>
          <div>
            <h1>{{PORTAL_TITLE}}</h1>
            <p>{{PORTAL_SUBTITLE}}</p>
          </div>
        </div>
        <nav class="series-nav" aria-label="产品线">
          <a class="series-nav-link{{PORTAL_NAV_CLASSINSHOP_ACTIVE}}" href="{{PORTAL_NAV_CLASSINSHOP_HREF}}">ClassInShop</a>
          <a class="series-nav-link{{PORTAL_NAV_TEACHERIN_ACTIVE}}" href="{{PORTAL_NAV_TEACHERIN_HREF}}">TeacherIn</a>
        </nav>
        <div class="topbar-badge" id="index-updated">索引加载中…</div>
      </div>
    </header>

    <main class="page">
      <section class="latest-panel" id="latest-panel" hidden></section>
      <section class="stats" id="stats"></section>

      <div class="toolbar-card">
        <span class="toolbar-title">筛选</span>
        <div class="field">
          <label for="filter-env">环境</label>
          <select id="filter-env">
            <option value="">全部</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-target">目标</label>
          <select id="filter-target">
            <option value="">全部</option>
          </select>
        </div>
        <div class="search-wrap field">
          <input
            id="filter-search"
            class="search-input"
            type="search"
            placeholder="搜索 Pipeline、分支、触发人…"
          />
        </div>
      </div>

      <section class="panel">
        <div class="panel-header">
          <h2>执行历史</h2>
          <span class="panel-meta" id="list-meta">加载中…</span>
        </div>
        <div class="list-head">
          <span>执行时间</span>
          <span>环境</span>
          <span>目标</span>
          <span>分支 / 触发人</span>
          <span>结果</span>
          <span>操作</span>
        </div>
        <div id="report-list" class="report-list loading">
          <div class="spinner"></div>
          <span>正在加载报告索引…</span>
        </div>
      </section>

      <p class="footer">最新报告在 latest 槽位 · 历史完整报告见 GitLab Pipeline / Artifacts</p>
    </main>

    <script>
      const PORTAL_SERIES = '{{PORTAL_SERIES}}';
      const PORTAL_INDEX_HREF = '{{PORTAL_INDEX_HREF}}';
      const PORTAL_REPORT_PREFIX = '{{PORTAL_REPORT_PREFIX}}';
      const listEl = document.getElementById('report-list');
      const latestPanelEl = document.getElementById('latest-panel');
      const statsEl = document.getElementById('stats');
      const listMetaEl = document.getElementById('list-meta');
      const indexUpdatedEl = document.getElementById('index-updated');
      const envSelect = document.getElementById('filter-env');
      const targetSelect = document.getElementById('filter-target');
      const searchInput = document.getElementById('filter-search');

      let allReports = [];

      function formatDate(value) {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return new Intl.DateTimeFormat('zh-CN', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false,
        }).format(date);
      }

      function uniqueSorted(values) {
        return [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
      }

      function fillSelect(select, values, labelFn) {
        for (const value of values) {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = labelFn ? labelFn(value) : value;
          select.appendChild(option);
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function isHostedEntry(item) {
        if (item.isLatest) return true;
        return typeof item.path === 'string' && item.path.includes('/latest/');
      }

      function displayTarget(value) {
        if (!value) return '—';
        if (value === 'all' || value === 'core') return '全量';
        return value;
      }

      function normalizeSeries(value) {
        return String(value || 'classinshop').trim() || 'classinshop';
      }

      function hostedHref(item) {
        if (item.path) return `${PORTAL_REPORT_PREFIX}${item.path}`;
        if (PORTAL_SERIES === 'teacherin') {
          return `${PORTAL_REPORT_PREFIX}teacherin/${item.env}/${item.target}/latest/enhanced/enhanced-report.html`;
        }
        return `${PORTAL_REPORT_PREFIX}${item.env}/${item.target}/latest/enhanced/enhanced-report.html`;
      }

      function renderActionLinks(item) {
        const links = [];
        if (item.buildUrl) {
          links.push(
            `<a class="link-btn" href="${escapeHtml(item.buildUrl)}" target="_blank" rel="noopener noreferrer">Pipeline</a>`,
          );
        }
        if (item.artifactUrl) {
          links.push(
            `<a class="link-btn primary" href="${escapeHtml(item.artifactUrl)}" target="_blank" rel="noopener noreferrer">Artifacts</a>`,
          );
        }
        if (links.length === 0) {
          return '<span class="meta-sub">无外链</span>';
        }
        return `<div class="action-links">${links.join('')}</div>`;
      }

      function renderLatestCards(reports) {
        const latestItems = reports.filter((item) => isHostedEntry(item));
        if (latestItems.length === 0) {
          latestPanelEl.hidden = true;
          latestPanelEl.innerHTML = '';
          return;
        }
        latestPanelEl.hidden = false;
        latestPanelEl.innerHTML = latestItems
          .map((item) => {
            const summary = item.summary || {};
            return `
              <a class="latest-card" href="${escapeHtml(hostedHref(item))}">
                <div>
                  <h3>最新 · env ${escapeHtml(item.env)} · ${escapeHtml(displayTarget(item.target))}</h3>
                  <p>Pipeline #${escapeHtml(item.pipelineId)} · ${formatDate(item.publishedAt)} · ✓${summary.passed ?? '—'} ✕${summary.failed ?? '—'}</p>
                </div>
                <span class="latest-cta">打开最新报告 →</span>
              </a>
            `;
          })
          .join('');
      }

      function reportStatus(item) {
        const failed = item.summary?.failed ?? 0;
        const skipped = item.summary?.skipped ?? 0;
        if (failed > 0) return 'fail';
        if (skipped > 0) return 'warn';
        return 'pass';
      }

      function renderStats(reports) {
        const envs = uniqueSorted(reports.map((item) => item.env));
        const failed = reports.filter((item) => (item.summary?.failed ?? 0) > 0).length;
        const passedAll = reports.filter((item) => reportStatus(item) === 'pass').length;

        statsEl.innerHTML = [
          {
            label: '报告总数',
            value: reports.length,
            hint: '历史 Pipeline 报告',
            accent: '#2563eb',
            cardBg: 'linear-gradient(145deg, #eff6ff 0%, #ffffff 70%)',
          },
          {
            label: '测试环境',
            value: envs.length,
            hint: envs.join(' / ') || '—',
            accent: '#7c3aed',
            cardBg: 'linear-gradient(145deg, #f5f3ff 0%, #ffffff 70%)',
          },
          {
            label: '全部通过',
            value: passedAll,
            hint: '无失败用例',
            accent: '#059669',
            cardBg: 'linear-gradient(145deg, #ecfdf5 0%, #ffffff 70%)',
          },
          {
            label: '含失败',
            value: failed,
            hint: failed > 0 ? '需关注' : '暂无',
            accent: failed > 0 ? '#dc2626' : '#64748b',
            cardBg:
              failed > 0
                ? 'linear-gradient(145deg, #fef2f2 0%, #ffffff 70%)'
                : 'linear-gradient(145deg, #f8fafc 0%, #ffffff 70%)',
          },
        ]
          .map(
            (item) => `
              <div class="stat-card" style="--accent:${item.accent};--card-bg:${item.cardBg}">
                <div class="stat-label">${item.label}</div>
                <div class="stat-value">${item.value}</div>
                <div class="stat-hint">${item.hint}</div>
              </div>
            `,
          )
          .join('');
      }

      function renderList(reports) {
        if (reports.length === 0) {
          listEl.className = 'empty';
          listEl.textContent = '没有匹配的执行记录。';
          listMetaEl.textContent = '0 条';
          return;
        }

        listEl.className = 'report-list';
        listMetaEl.textContent = `显示 ${reports.length} 条`;
        listEl.innerHTML = reports
          .map((item) => {
            const summary = item.summary || {};
            const passRate =
              summary.passRate != null ? `${Number(summary.passRate).toFixed(0)}%` : '—';
            const branch = item.branch || item.ref || '—';
            const author = item.author || '—';
            const status = reportStatus(item);
            const hosted = isHostedEntry(item);
            const latestBadge = hosted ? '<span class="badge-latest">最新</span>' : '';
            const metaSub = hosted
              ? `${item.env}/${item.target}/latest`
              : 'GitLab Pipeline / Artifacts';
            const rowClass = `report-row status-${status}${hosted ? '' : ' is-history'}`;
            const rowTag = 'div';
            const rowAttrs = '';

            return `
              <${rowTag} class="${rowClass}"${rowAttrs}>
                <div>
                  <div class="time-main">${formatDate(item.publishedAt)}${latestBadge}</div>
                  <span class="time-sub">Pipeline #${escapeHtml(item.pipelineId)}</span>
                </div>
                <div><span class="badge">env ${escapeHtml(item.env)}</span></div>
                <div><span class="target-chip">${escapeHtml(displayTarget(item.target))}</span></div>
                <div>
                  <div class="meta-title">${escapeHtml(branch)} · ${escapeHtml(author)}</div>
                  <div class="meta-sub">${escapeHtml(metaSub)}</div>
                </div>
                <div class="result-chips">
                  <span class="chip pass">✓ ${summary.passed ?? '—'}</span>
                  <span class="chip fail">✕ ${summary.failed ?? '—'}</span>
                  <span class="chip skip">− ${summary.skipped ?? '—'}</span>
                  <span class="chip rate">${passRate}</span>
                </div>
                <div class="action">${renderActionLinks(item)}</div>
              </${rowTag}>
            `;
          })
          .join('');
      }

      function applyFilters() {
        const env = envSelect.value;
        const target = targetSelect.value;
        const keyword = searchInput.value.trim().toLowerCase();

        const filtered = allReports.filter((item) => {
          if (env && item.env !== env) return false;
          if (target && item.target !== target) return false;
          if (!keyword) return true;
          const haystack = [
            item.pipelineId,
            item.target,
            item.env,
            item.branch,
            item.ref,
            item.author,
            item.path,
          ]
            .filter(Boolean)
            .join(' ')
            .toLowerCase();
          return haystack.includes(keyword);
        });

        renderLatestCards(filtered);
        renderList(filtered);
      }

      async function loadReports() {
        try {
          const response = await fetch(PORTAL_INDEX_HREF, { cache: 'no-store' });
          if (!response.ok) {
            throw new Error(`无法加载 reports-index.json (${response.status})`);
          }

          const data = await response.json();
          allReports = (Array.isArray(data.reports) ? data.reports : []).filter(
            (item) => normalizeSeries(item.series) === PORTAL_SERIES,
          );
          allReports.sort(
            (a, b) => new Date(b.publishedAt).getTime() - new Date(a.publishedAt).getTime(),
          );

          if (data.updatedAt) {
            indexUpdatedEl.textContent = `索引更新 ${formatDate(data.updatedAt)}`;
          } else {
            indexUpdatedEl.textContent = `共 ${allReports.length} 份报告`;
          }

          fillSelect(envSelect, uniqueSorted(allReports.map((item) => item.env)));
          fillSelect(targetSelect, uniqueSorted(allReports.map((item) => item.target)), displayTarget);
          renderStats(allReports);
          renderLatestCards(allReports);
          renderList(allReports);

          envSelect.addEventListener('change', applyFilters);
          targetSelect.addEventListener('change', applyFilters);
          searchInput.addEventListener('input', applyFilters);
        } catch (error) {
          listEl.className = 'error';
          listEl.textContent = error instanceof Error ? error.message : String(error);
          listMetaEl.textContent = '加载失败';
          indexUpdatedEl.textContent = '索引不可用';
        }
      }

      loadReports();
    </script>
  </body>
</html>
